apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../base

namePrefix: production-

patches:
  - patch: |
      - op: replace
        path: /spec/template/spec/domain/memory/guest
        value: 2048M
    target:
      kind: VirtualMachine
  - patch: |
      - op: replace
        path: /spec/to/name
        value: production-quotes-frontend
    target:
      kind: Route
      name: quotes-frontend
  - patch: |
      - op: replace
        path: /spec/to/name
        value: production-headless-service-backend
    target:
      kind: Route
      name: route-backend
  - patch: |
      - op: replace
        path: /spec/selector/vm.kubevirt.io~1name
        value: production-rhel9-quotes-backend
    target:
      kind: Service
      name: headless-service-backend
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: |
          URL=$(oc get route production-route-backend -o jsonpath='{.status.url}');
          oc create configmap environment-variables --from-literal=VITE_BACKEND_URL="$URL/quote" --dry-run=client -o yaml | oc apply -f -
    target:
      kind: Job
      name: configmap-pre-hook
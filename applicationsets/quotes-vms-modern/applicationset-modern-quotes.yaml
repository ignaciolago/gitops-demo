apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quotes-vms-modern
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
        - name: development
          env: development
          server: https://kubernetes.default.svc
        - name: production
          env: production
          server: https://kubernetes.default.svc
  template:
    metadata:
      name: "{{name}}-quotes-vms-modern"
    spec:
      project: default
      source:
        repoURL: https://github.com/ignaciolago/gitops-demo.git
        targetRevision: quotes
        path: "applicationsets/quotes-vms-modern/kustomize/{{env}}"
        kustomize:
          commonAnnotations:
            managed-cluster: "{{name}}"
      destination:
        server: "{{server}}"
        namespace: "{{name}}-quotes-vms-modern"
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true

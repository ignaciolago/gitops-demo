apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quotes-backend
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
        - name: dev
          env: dev
          server: https://kubernetes.default.svc
        - name: prod
          env: prod
          server: https://kubernetes.default.svc
  template:
    metadata:
      name: "{{name}}-quotes-backend"
    spec:
      project: openshift-gitops
      source:
        repoURL: https://github.com/ignaciolago/gitops-demo.git
        targetRevision: quotes
        path: "applicationsets/demo-vm/kustomize/{{env}}"
        kustomize:
          commonAnnotations:
            managed-cluster: "{{name}}"
      destination:
        server: "{{server}}"
        namespace: "{{name}}-quotes-backend"
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
